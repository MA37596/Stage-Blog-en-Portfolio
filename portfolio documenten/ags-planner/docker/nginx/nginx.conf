server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Yii2 pretty URL routing ondersteuning
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP verwerking via PHP-FPM socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;  # Pas aan naar jouw versie en socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    # Verbied gevaarlijke HTTP methoden
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Beveilig .htaccess bestanden
    location ~ /\.ht {
        deny all;
    }
}
